<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Tyler Guan — First-Generation Student. Professional Videographer." />
    <title>Tyler Guan — Videographer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <noscript>
      <style>
        .loader { display: none; }
        .wall:empty { min-height: 0; }
      </style>
    </noscript>
  </head>
  <body>
    <header class="masthead">
      <h1 class="name">Tyler Guan<span class="accent">.</span></h1>
      <p class="descriptor">First-Generation Student. Professional Videographer</p>
    </header>

    <main>
      <div class="loader" id="loader" role="status">
        <p class="loader-text">Tyler Guan <span class="loader-sub">— Loading reel</span></p>
        <span class="loader-blocks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
      </div>
      <section class="wall" id="wall" aria-label="Selected work"></section>
    </main>

    <footer class="contact">
      <h2 class="contact-heading">Contact</h2>
      <address class="contact-list">
        <ul>
          <li><a href="mailto:tylerwguan@gmail.com">tylerwguan@gmail.com</a></li>
          <li><a href="https://www.linkedin.com/in/tylerwguan" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
          <!-- Instagram link goes here as an additional <li> item. -->
        </ul>
      </address>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
